name: InkVault
options:
  bundleIdPrefix: com.inkvault
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    # NFR-05: iPad only
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: "NO"

targets:
  InkVault:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - "Resources/renderer/**"
      # renderer 资源用文件夹引用整目录打包，保留 renderer/ 子目录结构
      # （katex.min.css 以 fonts/ 相对路径引用字体，不能拍平）
      - path: Sources/Resources/renderer
        type: folder
    dependencies:
      - framework: build/SyncthingKernel.xcframework
        embed: true
    settings:
      base:
        # 包名必须与购买签名服务的档案 App ID 一致（超级签名固定包名，
        # 否则 fileproviderd 拒绝就地打开授权：surprising bundle identifier → Cocoa 257）
        PRODUCT_BUNDLE_IDENTIFIER: app.calcite3909.scorpio3556
        PRODUCT_NAME: InkVault
        INFOPLIST_FILE: App/Info.plist
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Go framework links ObjC runtime shims
        OTHER_LDFLAGS: ["-ObjC"]

  InkVaultTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: InkVault

schemes:
  InkVault:
    build:
      targets:
        InkVault: all
        InkVaultTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - InkVaultTests
