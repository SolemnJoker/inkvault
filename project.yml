name: InkVault
options:
  bundleIdPrefix: com.inkvault
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    # NFR-05: iPad only
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: "NO"

targets:
  InkVault:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - framework: build/SyncthingKernel.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inkvault.app
        PRODUCT_NAME: InkVault
        INFOPLIST_FILE: App/Info.plist
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        # Go framework links ObjC runtime shims
        OTHER_LDFLAGS: ["-ObjC"]

  InkVaultTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: InkVault

schemes:
  InkVault:
    build:
      targets:
        InkVault: all
        InkVaultTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - InkVaultTests
